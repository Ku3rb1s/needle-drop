<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <!-- Geschwister-Logo zu Musik-Bingo: gleiche Platte, kühler Verlauf, Label = Snippet-Leiter (0,1 s … 10 s) -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3be38b"/>
      <stop offset="1" stop-color="#1a9cff"/>
    </linearGradient>
    <linearGradient id="lab" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2bdc7e"/>
      <stop offset="1" stop-color="#1490f0"/>
    </linearGradient>
    <filter id="sh" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#06306a" flood-opacity=".45"/>
    </filter>
  </defs>
  <rect width="512" height="512" fill="url(#bg)"/>
  <g filter="url(#sh)">
    <circle cx="256" cy="256" r="196" fill="#111114"/>
  </g>
  <!-- Rillen -->
  <g fill="none" stroke="#fff" stroke-opacity=".08" stroke-width="2">
    <circle cx="256" cy="256" r="182"/><circle cx="256" cy="256" r="166"/><circle cx="256" cy="256" r="150"/>
    <circle cx="256" cy="256" r="134"/><circle cx="256" cy="256" r="118"/><circle cx="256" cy="256" r="104"/>
  </g>
  <!-- Glanz -->
  <path d="M256 256 L118 117 A196 196 0 0 1 176 77 Z" fill="#fff" fill-opacity=".1"/>
  <path d="M256 256 L394 395 A196 196 0 0 1 336 435 Z" fill="#fff" fill-opacity=".1"/>
  <circle cx="256" cy="256" r="92" fill="url(#lab)"/>
  <!-- Snippet-Leiter -->
  <g fill="#fff">
    <rect x="196" y="248" width="12" height="16" rx="6" opacity=".6"/>
    <rect x="217.6" y="242" width="12" height="28" rx="6" opacity=".7"/>
    <rect x="239.2" y="236" width="12" height="40" rx="6" opacity=".8"/>
    <rect x="260.8" y="230" width="12" height="52" rx="6" opacity=".88"/>
    <rect x="282.4" y="224" width="12" height="64" rx="6" opacity=".95"/>
    <rect x="304" y="218" width="12" height="76" rx="6"/>
  </g>
</svg>
