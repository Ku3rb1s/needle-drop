name: Tages-Challenge vorberechnen

# Schreibt jeden Tag die fehlenden Tagesdateien data/daily/JJJJ-MM-TT.json (bis heute + 14 Tage).
# Vorhandene Dateien bleiben unverändert – eine veröffentlichte Challenge ist fest.
# Keine Deezer-Anfragen (nur data/billions.json), darum darf das hier in den USA laufen.
# Per Hand: Actions → „Tages-Challenge vorberechnen“ → Run workflow.
on:
  schedule:
    - cron: '30 0 * * *'   # 0:30 UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Fehlende Tage schreiben
        run: node scripts/build-daily.js
      - name: Committen, falls neu
        run: |
          git add data/daily
          if git diff --cached --quiet; then
            echo "Keine neuen Tage."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Tages-Challenge vorberechnet ($(date +%Y-%m-%d))"
          git pull --rebase origin main
          git push
