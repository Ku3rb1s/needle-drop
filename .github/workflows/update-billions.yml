name: Billionärs-Club aktualisieren

# Baut data/billions.json jeden Monat neu (neue Songs mit ≥ 1 Mrd. Spotify-Streams kommen dazu)
# und committet nur, wenn sich etwas geändert hat. Per Hand: Actions → „Billionärs-Club aktualisieren“ → Run workflow.
on:
  schedule:
    - cron: '23 4 1 * *'   # am 1. jedes Monats, 04:23 UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Liste neu bauen
        run: node scripts/build-billions.js
      - name: Committen, falls geändert
        run: |
          if git diff --quiet -- data/billions.json; then
            echo "Keine Änderungen an der Liste."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/billions.json
          git commit -m "Billionärs Club automatisch aktualisiert ($(date +%Y-%m-%d))"
          # Falls während des Laufs jemand anderes gepusht hat: erst den neuen Stand holen
          git pull --rebase origin main
          git push
